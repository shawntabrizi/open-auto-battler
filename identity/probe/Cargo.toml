[workspace]
members = ["."]

[package]
name = "oab-identity-probe"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "oab-identity-probe"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

[dependencies]
pvm-contract-sdk = { git = "https://github.com/paritytech/cargo-pvm-contract", rev = "d5991131", default-features = false, features = ["alloc"] }
polkavm-derive = "0.35.0"
picoalloc = { version = "5", default-features = false }

[features]
abi-gen = ["pvm-contract-sdk/abi-gen"]
std = ["pvm-contract-sdk/std"]

[build-dependencies]
cargo-pvm-contract-builder = { git = "https://github.com/paritytech/cargo-pvm-contract", rev = "d5991131" }
