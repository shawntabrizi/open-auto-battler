# Test-only crate. It compiles the arena v2 source (`contract/src/main.rs`)
# unchanged, as a module, next to `oab-engine`, and checks that both give the
# same result for the golden-vector corpus. Not part of the root workspace:
# it needs the pinned pvm-contract-sdk.
#
#   CARGO_PVM_CONTRACT_INTERNAL=1 cargo test --manifest-path engine/arena-oracle/Cargo.toml
[workspace]
members = ["."]

[package]
name = "oab-arena-oracle"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
pvm-contract-sdk = { git = "https://github.com/paritytech/cargo-pvm-contract", rev = "d5991131", features = ["std", "alloc"] }
polkavm-derive = "0.35.0"
picoalloc = { version = "5", default-features = false }
parity-scale-codec = { version = "3.7", features = ["derive", "std"] }
oab-battle = { path = "../../battle" }
oab-game = { path = "../../game" }
oab-engine = { path = "..", features = ["vectors"] }
oab-assets = { path = "../../assets" }
tiny-keccak = { version = "2", features = ["keccak"] }
